<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZKY · 信息工作台</title><style>
:root{color-scheme:dark;--bg:#090e19;--panel:#111b2b;--line:#233149;--text:#e4edfc;--muted:#91a2bc;--cyan:#62e6cb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}button,input{font:inherit}button,a{touch-action:manipulation}a{color:inherit;text-decoration:none}button{cursor:pointer}header{border-bottom:1px solid var(--line);padding:22px 5%;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;letter-spacing:2px}.brand span{color:var(--cyan)}header small{color:var(--muted)}main{max-width:1380px;margin:auto;padding:42px 5%}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:30px}.eyebrow{font:12px monospace;color:var(--cyan);letter-spacing:2px}h1{font-size:36px;letter-spacing:-1px;margin:8px 0}p{color:var(--muted);margin:0}.clock{font:30px monospace}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px}.panel{border:1px solid var(--line);background:linear-gradient(140deg,#142034,#101827);border-radius:16px;overflow:hidden}.panel-head{padding:23px 25px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}h2{margin:0;font-size:19px}.badge{font-size:12px;color:var(--cyan);background:#62e6cb12;border:1px solid #62e6cb30;border-radius:20px;padding:3px 10px}.controls{padding:20px 25px;display:flex;gap:14px;flex-wrap:wrap}.tabs{display:flex;gap:6px;flex-wrap:wrap}button{background:#18263b;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:7px 13px}button.active{background:var(--cyan);color:#09231e;border-color:var(--cyan)}input{min-width:160px;flex:1;background:#0c1524;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px}.empty{padding:72px 25px 90px;text-align:center}.empty .icon{font:36px monospace;color:var(--cyan);margin-bottom:20px}.empty h3{font-size:19px;margin:0 0 10px}.empty p{font-size:14px}.news{padding:0 25px}.story{padding:24px 0;border-top:1px solid var(--line)}.story h3{font-size:19px;margin:10px 0}.story a:hover{color:var(--cyan)}.meta{display:flex;gap:12px;color:var(--muted);font-size:12px}.story p{font-size:14px}.foot{padding:15px 25px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.aside{display:grid;gap:22px;align-content:start}.aside .body{padding:22px}.links{display:grid;gap:10px}.links a{padding:13px;background:#ffffff04;border:1px solid var(--line);border-radius:9px;display:flex;justify-content:space-between}.links a:hover{border-color:var(--cyan)}.note{font-size:13px}.dot{display:inline-block;width:7px;height:7px;background:var(--cyan);border-radius:50%;margin-right:7px}footer{color:var(--muted);font-size:12px;margin-top:30px;display:flex;justify-content:space-between}a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}@media(max-width:850px){.layout{grid-template-columns:1fr}.aside{grid-template-columns:1fr 1fr}.intro{align-items:start}.clock{font-size:23px}}@media(max-width:550px){main{padding-top:25px}h1{font-size:29px}.aside{grid-template-columns:1fr}.intro{display:block}.clock{margin-top:20px}header small{display:none}.controls,.panel-head{padding:18px}footer{display:block}}
</style></head><body><header><a href="./" class="brand">ZKY<span> / </span>WORKSPACE</a><small>信息 · 工具 · 灵感</small></header><main><section class="intro"><div><div class="eyebrow">YOUR DAILY COMMAND CENTER</div><h1>打开世界，从这里开始。</h1><p>每日资讯与常用入口，汇集于一个工作台。</p></div><div><div class="clock" id="clock"></div><p id="date"></p></div></section><div class="layout"><section class="panel"><div class="panel-head"><h2>每日新闻 <small style="color:var(--muted);font-size:12px;font-weight:400"> / DAILY BRIEF</small></h2><span class="badge" id="status">等待接入</span></div><div class="controls"><div class="tabs" aria-label="新闻分类"><button class="active" data-cat="全部">全部</button><button data-cat="国内">国内</button><button data-cat="国际">国际</button><button data-cat="科技">科技</button><button data-cat="AI">AI</button></div><input id="search" type="search" aria-label="搜索新闻" placeholder="搜索新闻关键词…"></div><div id="news" class="news" aria-live="polite"></div><div class="empty" id="empty"><div class="icon">[ ◇ ]</div><h3>你的每日简报，即将就位</h3><p>新闻模块已准备好，等待新闻数据接入。</p><p>接入后，这里将展示标题、摘要、来源与原文链接。</p></div><div class="foot" id="updated">最近更新：暂无数据</div></section><aside class="aside"><section class="panel"><div class="panel-head"><h2>快捷访问</h2><span class="eyebrow">LINKS</span></div><div class="body links"><a href="https://github.com/zky519" target="_blank" rel="noopener noreferrer">GitHub <span>↗</span></a><a href="https://github.com/zky519/zky519.github.io" target="_blank" rel="noopener noreferrer">网站仓库 <span>↗</span></a></div></section><section class="panel"><div class="panel-head"><h2>工作台状态</h2></div><div class="body"><p class="note"><span class="dot"></span>网页框架已就绪</p><p class="note" style="margin-top:12px">新闻数据由独立模块提供。更多工具与信息面板将在这里逐步加入。</p></div></section></aside></div><footer><span>ZKY WORKSPACE · 个人信息工作台</span><span>保持好奇，保持连接。</span></footer></main><script src="news-data.js"></script><script>
let category='全部';const data=window.NEWS_DATA||{updatedAt:null,items:[]};const items=Array.isArray(data.items)?data.items:[];const el=id=>document.getElementById(id);function tick(){const d=new Date;el('clock').textContent=d.toLocaleTimeString('zh-CN',{hour12:false,timeZone:'Asia/Shanghai'});el('date').textContent=d.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long',timeZone:'Asia/Shanghai'});}tick();setInterval(tick,1000);function text(tag,value,cls){const n=document.createElement(tag);n.textContent=value||'';if(cls)n.className=cls;return n}function render(){const q=el('search').value.trim().toLowerCase();const list=items.filter(n=>(category==='全部'||n.category===category)&&`${n.title||''} ${n.summary||''}`.toLowerCase().includes(q));el('news').replaceChildren();el('empty').hidden=list.length>0;if(!list.length&&items.length){el('empty').querySelector('h3').textContent='没有找到匹配的新闻';el('empty').querySelectorAll('p')[0].textContent='试试其他分类或关键词。';el('empty').querySelectorAll('p')[1].textContent='';}for(const n of list){const article=text('article','','story');const meta=text('div','','meta');meta.append(text('span',n.category),text('span',n.source),text('span',n.publishedAt?new Date(n.publishedAt).toLocaleString('zh-CN'):''));article.append(meta);const h=text('h3');try{const u=new URL(n.url);if(!['http:','https:'].includes(u.protocol))throw Error();const a=text('a',n.title);a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';h.append(a)}catch{h.textContent=n.title||'未命名新闻'}article.append(h,text('p',n.summary));el('news').append(article)}}document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));render()});el('search').oninput=render;if(items.length)el('status').textContent=`${items.length} 条资讯`;if(data.updatedAt){const d=new Date(data.updatedAt);if(!isNaN(d))el('updated').textContent='最近更新：'+d.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})}render();
</script></body></html>
